services:
  c-dev:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    # KI-Agent unterstützt: Environment variables for X11 Forwarding
    environment:
      - DISPLAY=host.docker.internal:0

  # KI-Agent unterstützt: Local MongoDB replacing Atlas
  mongo:
    image: mongo:4.4
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
      - ./biotope_results:/app/results
      - ./build:/app/build
      - ./web:/app/web
    working_dir: /app
    ports:
      - "8000:8000"
    # KI-Agent unterstützt: The Shoulder-Duel referee runs biotope_headless in this
    # process (ADR-0028), so the backend needs the same C runtime libs as the
    # matchmaker (libgomp1 for OpenMP, libcurl4 for the linked network layer).
    command: /bin/bash -c "pip install -r requirements.txt && apt-get update && apt-get install -y libgomp1 libcurl4 && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    # KI-Agent unterstützt: Environment variables for development
    environment:
      - PYTHONUNBUFFERED=1
    # KI-Agent unterstützt: Report "healthy" only once uvicorn actually answers on
    # port 8000. start_period covers the one-off `pip install` window so early
    # failures are not counted; the slim image has no curl, hence the urllib probe.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  matchmaker:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
      - ./biotope_results:/app/results
      - ./worker_bin:/app/build
    working_dir: /app
    env_file:
      - .env
    command: /bin/bash -c "pip install -r requirements.txt && apt-get update && apt-get install -y libgomp1 libcurl4 && python3 app/worker.py"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
