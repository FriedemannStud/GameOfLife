name: CI

on:
  push:
    branches: [biotop]
  pull_request:
    branches: [biotop]

jobs:
  build-c:
    name: Build C Binaries (Headless + Hyper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev

      # The GUI binary (build/biotope) requires Raylib and a display — skip in CI.
      # Only build the server-side binaries that have no GUI dependency.
      - name: Build headless and hyper-worker
        run: |
          make build/biotope_headless build/biotope_hyper_worker

      - name: Verify binaries exist and are executable
        run: |
          test -x build/biotope_headless
          test -x build/biotope_hyper_worker

  test-c:
    name: C Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libcurl4-openssl-dev

      # Test includes use "../core_types.h" relative to tests/ → project root.
      # Headers live in src/core/, so we create root-level symlinks for the compiler.
      - name: Create header symlinks for test compilation
        run: |
          ln -s src/core/core_types.h core_types.h
          ln -s src/core/config.h config.h
          ln -s src/io/file_io.h file_io.h

      - name: Build and run core types test
        run: |
          gcc tests/test_core_types.c \
            -Isrc/core -Isrc/vendor/cJSON -std=c99 \
            -o /tmp/test_core_types && /tmp/test_core_types

      - name: Build and run file IO test
        run: |
          gcc tests/test_file_io.c \
            src/io/file_io.c src/vendor/cJSON/cJSON.c src/core/game_logic.c \
            -Isrc/core -Isrc/io -Isrc/vendor/cJSON -std=c99 -fopenmp -lm -lcurl \
            -o /tmp/test_file_io && /tmp/test_file_io

  test-backend:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ranking unit tests
        run: python backend/tests/test_ranking.py

      - name: Run validator unit tests
        run: python backend/tests/test_validators.py

  lint-python:
    name: Python Lint (black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Versions are kept in sync with backend/requirements-dev.txt.
      # Config (line-length 88, rules E/F/W/I) lives in the project-root pyproject.toml.
      - name: Install black + ruff
        run: pip install black==24.10.0 ruff==0.15.17

      # Scope: backend/ only — that is the formatted/linted source tree.
      - name: Check formatting (black)
        run: black --check backend/

      - name: Lint (ruff)
        run: ruff check backend/
