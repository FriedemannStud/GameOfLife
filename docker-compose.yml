services:
  c-dev:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    # KI-Agent unterstützt: Environment variables for X11 Forwarding
    environment:
      - DISPLAY=host.docker.internal:0

  # KI-Agent unterstützt: Local MongoDB replacing Atlas
  mongo:
    image: mongo:7
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
      - ./biotope_results:/app/results
      - ./build:/app/build
    working_dir: /app
    ports:
      - "8000:8000"
    command: /bin/bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    # KI-Agent unterstützt: Environment variables for development
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  matchmaker:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
      - ./biotope_results:/app/results
      - ./build:/app/build
    working_dir: /app
    env_file:
      - .env
    command: /bin/bash -c "pip install -r requirements.txt && apt-get update && apt-get install -y libgomp1 libcurl4 && python3 app/worker.py"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
