name: CI

on:
  push:
    branches: [biotop]
  pull_request:
    branches: [biotop]

jobs:
  build-c:
    name: Build C Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraylib-dev libcurl4-openssl-dev

      - name: Build all targets
        run: make

      - name: Verify binaries exist
        run: |
          test -f build/biotope_headless
          test -f build/biotope_hyper_worker

  test-c:
    name: C Unit Tests
    runs-on: ubuntu-latest
    needs: build-c
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libraylib-dev libcurl4-openssl-dev

      - name: Build and run core types test
        run: |
          gcc tests/test_core_types.c \
            -Isrc/core -Isrc/vendor/cJSON \
            -o /tmp/test_core_types && /tmp/test_core_types

      - name: Build and run file IO test
        run: |
          gcc tests/test_file_io.c src/io/file_io.c src/vendor/cJSON/cJSON.c \
            src/core/game_logic.c \
            -Isrc/core -Isrc/io -Isrc/vendor/cJSON \
            -lm -o /tmp/test_file_io && /tmp/test_file_io

  test-backend:
    name: Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run ranking unit tests
        run: python backend/tests/test_ranking.py

      - name: Run validator unit tests
        run: python backend/tests/test_validators.py
