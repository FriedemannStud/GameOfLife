services:
  c-dev:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    # KI-Agent unterstützt: Environment variables for X11 Forwarding
    environment:
      - DISPLAY=host.docker.internal:0

  backend:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
      - ./biotope_results:/app/results
      - ./build:/app/build
    working_dir: /app
    ports:
      - "8000:8000"
    command: /bin/bash -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    # KI-Agent unterstützt: Environment variables for development
    environment:
      - PYTHONUNBUFFERED=1

  matchmaker:
    image: python:3.11-slim
    volumes:
      - ./backend:/app
      - ./biotope_results:/app/results
      - ./build:/app/build
    working_dir: /app
    env_file:
      - .env
    command: /bin/bash -c "pip install -r requirements.txt && apt-get update && apt-get install -y libgomp1 libcurl4 && python3 app/worker.py"
    environment:
      - PYTHONUNBUFFERED=1
